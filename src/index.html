<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPT App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0c0c0e;
      --surface:   #141418;
      --border:    #2a2a35;
      --accent:    #7c6af7;
      --accent2:   #f76a6a;
      --text:      #e8e8f0;
      --muted:     #6a6a80;
      --mono:      'IBM Plex Mono', monospace;
      --sans:      'Syne', sans-serif;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }

    /* ── Layout ──────────────────────────────────────── */
    .app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }

    /* ── Sidebar ─────────────────────────────────────── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      padding: 24px 0;
      overflow-y: auto;
    }
    .sidebar-logo {
      font-size: 18px; font-weight: 800; letter-spacing: -0.5px;
      padding: 0 20px 20px;
      border-bottom: 1px solid var(--border);
      color: var(--accent);
    }
    .sidebar-logo span { color: var(--text); }

    .section-title {
      font-size: 10px; font-weight: 600; letter-spacing: 2px;
      color: var(--muted); text-transform: uppercase;
      padding: 20px 20px 8px;
    }

    /* API Key */
    .api-key-wrap { padding: 0 16px 16px; }
    .api-key-wrap input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; font-family: var(--mono);
      font-size: 12px; color: var(--text); outline: none;
      transition: border-color .2s;
    }
    .api-key-wrap input:focus { border-color: var(--accent); }
    .api-key-wrap button {
      margin-top: 8px; width: 100%; background: var(--accent);
      border: none; border-radius: 8px; padding: 8px;
      font-family: var(--sans); font-weight: 600; font-size: 13px;
      color: #fff; cursor: pointer; transition: opacity .2s;
    }
    .api-key-wrap button:hover { opacity: .85; }
    .api-status { font-size: 11px; margin-top: 6px; color: var(--muted); font-family: var(--mono); }
    .api-status.ok { color: #6af7a0; }

    /* Rules */
    .rules-list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
    .rule-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px;
      display: flex; align-items: flex-start; gap: 10px;
      transition: border-color .2s;
    }
    .rule-card:hover { border-color: var(--accent); }
    .rule-card.disabled { opacity: .45; }
    .rule-info { flex: 1; min-width: 0; }
    .rule-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rule-desc { font-size: 10px; color: var(--muted); margin-top: 2px; line-height: 1.4; font-family: var(--mono); }
    .rule-badge {
      font-size: 9px; font-family: var(--mono); padding: 2px 5px;
      border-radius: 4px; background: #1e1e2e; color: var(--muted);
      margin-top: 4px; display: inline-block;
    }
    .rule-badge.block { color: var(--accent2); }
    .rule-badge.transform, .rule-badge.prepend, .rule-badge.append { color: #6af7d0; }

    /* Toggle */
    .toggle { position: relative; width: 32px; height: 18px; flex-shrink: 0; margin-top: 2px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0; border-radius: 18px;
      background: var(--border); cursor: pointer; transition: background .2s;
    }
    .toggle-slider::after {
      content: ''; position: absolute; left: 3px; top: 3px;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--muted); transition: transform .2s, background .2s;
    }
    .toggle input:checked + .toggle-slider { background: var(--accent); }
    .toggle input:checked + .toggle-slider::after { transform: translateX(14px); background: #fff; }

    /* ── Main ────────────────────────────────────────── */
    .main { display: flex; flex-direction: column; overflow: hidden; }

    .chat-header {
      padding: 20px 28px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .chat-header h1 { font-size: 16px; font-weight: 800; }
    .clear-btn {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 14px; color: var(--muted); font-family: var(--sans);
      font-size: 12px; cursor: pointer; transition: all .2s;
    }
    .clear-btn:hover { border-color: var(--accent2); color: var(--accent2); }

    /* Messages */
    .messages { flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .message { display: flex; gap: 12px; max-width: 820px; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; flex-shrink: 0;
    }
    .message.assistant .avatar { background: var(--accent); color: #fff; }
    .message.user .avatar { background: #2e2e3e; color: var(--text); }

    .bubble {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px;
      font-size: 14px; line-height: 1.65;
      white-space: pre-wrap; word-break: break-word;
    }
    .message.user .bubble { background: #1c1c2e; border-color: #2e2e50; }
    .message.error .bubble { border-color: var(--accent2); color: var(--accent2); }

    /* Typing indicator */
    .typing .bubble { padding: 16px; }
    .dots { display: flex; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce .9s infinite; }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

    /* Input area */
    .input-area {
      padding: 16px 28px 20px;
      border-top: 1px solid var(--border);
      display: flex; gap: 12px; align-items: flex-end;
    }
    .input-area textarea {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px;
      font-family: var(--sans); font-size: 14px; color: var(--text);
      resize: none; outline: none; min-height: 48px; max-height: 160px;
      line-height: 1.5; transition: border-color .2s;
    }
    .input-area textarea:focus { border-color: var(--accent); }
    .send-btn {
      background: var(--accent); border: none; border-radius: 12px;
      width: 48px; height: 48px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .2s, transform .1s;
      flex-shrink: 0;
    }
    .send-btn:hover { opacity: .85; }
    .send-btn:active { transform: scale(.95); }
    .send-btn:disabled { opacity: .4; cursor: not-allowed; }
    .send-btn svg { width: 20px; height: 20px; fill: #fff; }

    /* Welcome */
    .welcome {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      color: var(--muted);
    }
    .welcome-icon { font-size: 48px; }
    .welcome h2 { font-size: 20px; font-weight: 800; color: var(--text); }
    .welcome p { font-size: 13px; font-family: var(--mono); }
  </style>
</head>
<body>
<div class="app">

  <!-- ── Sidebar ────────────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-logo">GPT<span>App</span></div>

    <div class="section-title">API Key</div>
    <div class="api-key-wrap">
      <input type="password" id="apiKeyInput" placeholder="sk-..." />
      <button id="saveKeyBtn">Save Key</button>
      <div class="api-status" id="apiStatus">Not configured</div>
    </div>

    <div class="section-title">Prompt Rules</div>
    <div class="rules-list" id="rulesList">Loading…</div>
  </aside>

  <!-- ── Main ──────────────────────────────────────────────────── -->
  <main class="main">
    <header class="chat-header">
      <h1>Chat</h1>
      <button class="clear-btn" id="clearBtn">Clear conversation</button>
    </header>

    <div class="messages" id="messages">
      <div class="welcome">
        <div class="welcome-icon">⚡</div>
        <h2>Ready to chat</h2>
        <p>Set your API key, then send a message.</p>
      </div>
    </div>

    <div class="input-area">
      <textarea id="userInput" placeholder="Type a message… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
      <button class="send-btn" id="sendBtn" disabled>
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
  </main>

</div>

<script src="renderer.js"></script>
</body>
</html>
